services:
  mysql-wallet:
    image: mysql:8.0
    platform: linux/amd64
    container_name: mysql-wallet
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wallet
    ports:
      - "3306:3306"
    volumes:
      - mysql_wallet_data:/var/lib/mysql
      - ./scripts/mysql-wallet:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-balances:
    image: mysql:8.0
    platform: linux/amd64
    container_name: mysql-balances
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: balances
    ports:
      - "3307:3306"
    volumes:
      - mysql_balances_data:/var/lib/mysql
      - ./node/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    environment:
      TZ: America/Sao_Paulo
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      TZ: America/Sao_Paulo
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      CONFLUENT_METRICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.5.3
    container_name: control-center
    hostname: control-center
    depends_on:
      - kafka
    ports:
      - "9021:9021"
    environment:
      TZ: America/Sao_Paulo
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  wallet-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet-core
    platform: linux/amd64
    depends_on:
      mysql-wallet:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: mysql-wallet
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: wallet
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
    restart: on-failure

  balances:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: balances
    platform: linux/amd64
    depends_on:
      mysql-balances:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      HTTP_PORT: 3003
      DB_HOST: mysql-balances
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: balances
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: balances-service
      KAFKA_GROUP_ID: balances-consumer-group
      KAFKA_TOPIC_BALANCE_UPDATED: balance_updated
    ports:
      - "3003:3003"
    restart: on-failure

volumes:
  mysql_wallet_data:
  mysql_balances_data:
